<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TG 频道视频搬运 · 管理面板</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --line: #2a2e38; --fg: #e6e8eb;
    --muted: #8b909a; --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.5;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px; display: grid; gap: 18px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=password], textarea, select {
    width: 100%; background: #11141a; border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn {
    border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 500;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    padding: 3px 10px; border-radius: 999px; background: #11141a; border: 1px solid var(--line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--green); } .dot.off { background: var(--red); }
  .dot.warn { background: var(--amber); }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 6px; }
  .stat .n { font-size: 22px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  .checkbox { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .checkbox input { width: auto; }
  #logs {
    background: #0a0c10; border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px;
    height: 280px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; color: #c9d1d9;
  }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #11141a; border: 1px solid var(--line); padding: 10px 18px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--red); color: #fca5a5; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <span style="font-size:22px">📺</span>
  <h1>TG 频道视频搬运 · 管理面板</h1>
</header>

<div class="wrap">
  <!-- 状态卡 -->
  <div class="card">
    <h2>运行状态</h2>
    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center">
      <span class="pill"><span id="dot-state" class="dot"></span><span id="state-text">加载中…</span></span>
      <span class="pill"><span id="dot-auth" class="dot"></span><span id="auth-text">登录状态未知</span></span>
    </div>
    <div class="stats">
      <div class="stat"><div class="n" id="st-forwarded">0</div><div class="l">已搬运视频</div></div>
      <div class="stat"><div class="n" id="st-errors">0</div><div class="l">失败次数</div></div>
      <div class="stat"><div class="n" id="st-started" style="font-size:14px">—</div><div class="l">启动时间</div></div>
      <div class="stat"><div class="n" id="st-last" style="font-size:14px">—</div><div class="l">最近一条</div></div>
    </div>
    <div id="problems" class="hint"></div>
    <div class="btns">
      <button class="btn green" id="btn-start">▶ 启动监控</button>
      <button class="btn red" id="btn-stop">■ 停止</button>
    </div>
  </div>

  <!-- 登录卡 -->
  <div class="card" id="login-card">
    <h2>账号登录</h2>
    <p class="muted" id="login-status">请先填好下方的 API 凭证并保存，再用手机号登录。</p>
    <div id="login-form">
      <div class="row">
        <div>
          <label>手机号（含国家码，如 +8613800138000）</label>
          <input type="text" id="phone" placeholder="+8613800138000" />
        </div>
        <div style="display:flex; align-items:flex-end">
          <button class="btn" id="btn-sendcode">发送验证码</button>
        </div>
      </div>
      <div class="row" id="code-row">
        <div>
          <label>验证码</label>
          <input type="text" id="code" placeholder="Telegram 收到的验证码" />
        </div>
        <div>
          <label>两步验证密码（如未开启则留空）</label>
          <input type="password" id="password" placeholder="可选" />
        </div>
      </div>
      <div class="btns">
        <button class="btn" id="btn-verify">登录</button>
      </div>
    </div>
    <div id="logged-in" class="hidden">
      <p class="muted">✅ 已登录。</p>
      <button class="btn ghost" id="btn-logout">退出登录</button>
    </div>
  </div>

  <!-- 设置卡 -->
  <div class="card">
    <h2>配置</h2>
    <div class="row">
      <div>
        <label>API ID</label>
        <input type="number" id="api_id" placeholder="从 my.telegram.org 获取" />
      </div>
      <div>
        <label>API Hash</label>
        <input type="text" id="api_hash" placeholder="从 my.telegram.org 获取" />
        <div class="hint">已保存后此处显示为掩码，留空表示不修改。</div>
      </div>
    </div>
    <label>源频道（要监控的频道，每行一个；支持 @用户名 / -100数字ID / t.me 链接）</label>
    <textarea id="source_channels" placeholder="@source_channel_1&#10;@source_channel_2"></textarea>
    <label>目标频道（搬运到哪里）</label>
    <input type="text" id="target_channel" placeholder="@my_target_channel" />
    <div class="row">
      <div>
        <label>搬运模式</label>
        <select id="mode">
          <option value="copy">copy（去掉"转发自"标签，像原创）</option>
          <option value="forward">forward（直接转发，保留来源）</option>
        </select>
      </div>
      <div>
        <label>会话名称（Session）</label>
        <input type="text" id="session_name" placeholder="forwarder" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>启动时回填历史视频条数（0=只监控新视频）</label>
        <input type="number" id="backfill_limit" min="0" />
      </div>
      <div>
        <label>每条搬运间隔秒数（防限流，建议 2~5）</label>
        <input type="number" id="send_delay" min="0" />
      </div>
    </div>
    <div class="checkbox">
      <input type="checkbox" id="keep_caption" />
      <label style="margin:0">保留原文案（仅 copy 模式生效）</label>
    </div>
    <div class="btns">
      <button class="btn" id="btn-save">💾 保存配置</button>
    </div>
    <div class="hint">提示：修改 API 凭证或会话名后需重新登录；修改频道后请停止再重新启动监控。</div>
  </div>

  <!-- 日志卡 -->
  <div class="card">
    <h2>运行日志</h2>
    <div id="logs"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(msg, isErr = false) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => { t.className = "toast"; }, 2600);
}

async function api(path, method = "GET", body = null) {
  const opt = { method, headers: { "Content-Type": "application/json" } };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(path, opt);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ("请求失败 " + res.status));
  return data;
}

let settingsDirty = false;
["api_id","api_hash","source_channels","target_channel","mode","session_name",
 "backfill_limit","send_delay","keep_caption"].forEach(id => {
  document.addEventListener("input", (e) => { if (e.target.id === id) settingsDirty = true; });
});

function fillSettings(s) {
  if (settingsDirty) return; // 用户正在编辑则不覆盖
  $("api_id").value = s.api_id || "";
  $("api_hash").value = s.api_hash_set ? s.api_hash : "";
  $("api_hash").placeholder = s.api_hash_set ? "已设置（留空不改）" : "从 my.telegram.org 获取";
  $("source_channels").value = (s.source_channels || []).join("\n");
  $("target_channel").value = s.target_channel || "";
  $("mode").value = s.mode || "copy";
  $("session_name").value = s.session_name || "forwarder";
  $("backfill_limit").value = s.backfill_limit ?? 0;
  $("send_delay").value = s.send_delay ?? 3;
  $("keep_caption").checked = !!s.keep_caption;
}

function renderStatus(st) {
  const running = st.state === "running";
  $("dot-state").className = "dot " + (running ? "on" : "off");
  $("state-text").textContent = running ? "监控中" : "已停止";
  $("dot-auth").className = "dot " + (st.authorized ? "on" : (st.awaiting_code ? "warn" : "off"));
  $("auth-text").textContent = st.authorized ? "已登录" : (st.awaiting_code ? "等待验证码" : "未登录");

  $("st-forwarded").textContent = st.stats.forwarded ?? 0;
  $("st-errors").textContent = st.stats.errors ?? 0;
  $("st-started").textContent = st.stats.started_at_str || "—";
  $("st-last").textContent = st.stats.last_video_at_str || "—";

  $("problems").textContent = (st.problems && st.problems.length)
    ? ("⚠ 配置待完善：" + st.problems.join("、")) : "";

  $("btn-start").disabled = running || !st.authorized;
  $("btn-stop").disabled = !running;

  // 登录区块
  $("login-form").classList.toggle("hidden", st.authorized);
  $("logged-in").classList.toggle("hidden", !st.authorized);
  $("code-row").style.display = st.awaiting_code ? "" : "grid";

  fillSettings(st.settings);
}

async function refreshStatus() {
  try { renderStatus(await api("/api/status")); } catch (e) { /* ignore */ }
}

async function refreshLogs() {
  try {
    const { logs } = await api("/api/logs?limit=200");
    const box = $("logs");
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.textContent = logs.join("\n");
    if (atBottom) box.scrollTop = box.scrollHeight;
  } catch (e) { /* ignore */ }
}

function collectSettings() {
  return {
    api_id: parseInt($("api_id").value || "0", 10),
    api_hash: $("api_hash").value.trim(),
    session_name: $("session_name").value.trim() || "forwarder",
    source_channels: $("source_channels").value.split("\n").map(s => s.trim()).filter(Boolean),
    target_channel: $("target_channel").value.trim(),
    mode: $("mode").value,
    keep_caption: $("keep_caption").checked,
    backfill_limit: parseInt($("backfill_limit").value || "0", 10),
    send_delay: parseInt($("send_delay").value || "0", 10),
  };
}

$("btn-save").onclick = async () => {
  try {
    await api("/api/settings", "POST", collectSettings());
    settingsDirty = false;
    toast("配置已保存");
    refreshStatus();
  } catch (e) { toast(e.message, true); }
};

$("btn-sendcode").onclick = async () => {
  try {
    // 先保存设置，确保 api 凭证可用
    await api("/api/settings", "POST", collectSettings());
    settingsDirty = false;
    const phone = $("phone").value.trim();
    if (!phone) return toast("请填写手机号", true);
    const r = await api("/api/login/send-code", "POST", { phone });
    toast(r.message || "验证码已发送");
    refreshStatus();
  } catch (e) { toast(e.message, true); }
};

$("btn-verify").onclick = async () => {
  try {
    const code = $("code").value.trim();
    const password = $("password").value;
    if (!code) return toast("请填写验证码", true);
    const r = await api("/api/login/verify", "POST", { code, password });
    toast(r.message || "登录成功");
    $("code").value = ""; $("password").value = "";
    refreshStatus();
  } catch (e) { toast(e.message, true); }
};

$("btn-logout").onclick = async () => {
  try { await api("/api/logout", "POST"); toast("已退出登录"); refreshStatus(); }
  catch (e) { toast(e.message, true); }
};

$("btn-start").onclick = async () => {
  try { renderStatus(await api("/api/start", "POST")); toast("已启动监控"); }
  catch (e) { toast(e.message, true); }
};

$("btn-stop").onclick = async () => {
  try { renderStatus(await api("/api/stop", "POST")); toast("已停止"); }
  catch (e) { toast(e.message, true); }
};

// 轮询
refreshStatus();
refreshLogs();
setInterval(refreshStatus, 3000);
setInterval(refreshLogs, 3000);
</script>
</body>
</html>
